[project]
name = "hidden-market-arbitrage"
version = "0.1.0"
description = "Hidden-market arbitrage over Minneapolis-Saint Paul businesses: a DuckDB model, a scorer, and block-level pairs. Shelved 2026-09-30."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbitrage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
